<!--
  Settings pane for Paper Reading Agent (Zotero 7+ Zotero.PreferencePanes).
  Loaded as a FRAGMENT (NO XML declaration / NO DOCTYPE): Zotero wraps this file
  inside its own <div> and parses it as application/xml, so a leading <?xml?> makes
  the document not well-formed and the pane renders blank.
  Controls auto-bind to prefs via a short pref key; zotero-plugin-scaffold rewrites
  each to the full extensions.paper-reading-agent.<key> at build time (the keys must
  be declared in addon/prefs.js). The backend group show/hide and the Test button
  are wired in content/preferences.js (loaded via register scripts).
-->
<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  style="padding: 4px 8px"
>
  <groupbox>
    <label><html:h2>Paper Reading Agent</html:h2></label>
    <description style="margin: 0 0 6px">
      Chat with the open paper. Choose which local agent CLI answers, and how it
      runs.
    </description>
    <hbox align="center">
      <label value="Agent backend" style="min-width: 12em" />
      <menulist id="pra-backend" preference="backend" native="true">
        <menupopup>
          <menuitem value="codex" label="Codex" />
          <menuitem value="claude" label="Claude Code" />
          <menuitem value="chatgpt" label="ChatGPT (chat2api)" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox id="pra-codex-group">
    <label><html:h2>Codex</html:h2></label>
    <hbox align="center">
      <label value="Path (optional)" style="min-width: 12em" />
      <html:input
        type="text"
        preference="codexPath"
        placeholder="auto-detected on PATH"
        style="flex: 1"
      />
    </hbox>
    <hbox align="center">
      <label value="Model" style="min-width: 12em" />
      <html:input
        id="pra-codex-model"
        type="text"
        preference="model"
        list="pra-codex-models"
        placeholder="Codex config/default"
        style="flex: 1"
      />
      <button id="pra-codex-model-default" label="Use default" />
      <button id="pra-codex-model-refresh" label="Refresh" />
    </hbox>
    <html:datalist id="pra-codex-models"></html:datalist>
    <description
      id="pra-codex-model-status"
      style="margin: 2px 0 5px 12em; color: var(--fill-secondary, #666)"
      >Loading model information…</description
    >
    <hbox align="center">
      <label value="Reasoning effort" style="min-width: 12em" />
      <menulist preference="reasoningEffort" native="true">
        <menupopup>
          <menuitem value="" label="Default" />
          <menuitem value="minimal" label="minimal (fastest)" />
          <menuitem value="low" label="low" />
          <menuitem value="medium" label="medium" />
          <menuitem value="high" label="high (deepest)" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox id="pra-claude-group">
    <label><html:h2>Claude Code</html:h2></label>
    <hbox align="center">
      <label value="Path (optional)" style="min-width: 12em" />
      <html:input
        type="text"
        preference="claudePath"
        placeholder="auto-detected on PATH"
        style="flex: 1"
      />
    </hbox>
    <hbox align="center">
      <label value="Model" style="min-width: 12em" />
      <html:input
        id="pra-claude-model"
        type="text"
        preference="claudeModel"
        list="pra-claude-models"
        placeholder="Claude Code default"
        style="flex: 1"
      />
      <button id="pra-claude-model-default" label="Use default" />
      <button id="pra-claude-model-refresh" label="Refresh" />
    </hbox>
    <html:datalist id="pra-claude-models"></html:datalist>
    <description
      id="pra-claude-model-status"
      style="margin: 2px 0 5px 12em; color: var(--fill-secondary, #666)"
      >Loading model information…</description
    >
    <hbox align="center">
      <label value="Permission mode" style="min-width: 12em" />
      <menulist preference="permissionMode" native="true">
        <menupopup>
          <menuitem value="default" label="default (read-only)" />
          <menuitem value="acceptEdits" label="acceptEdits" />
          <menuitem value="dontAsk" label="dontAsk" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox id="pra-chatgpt-group">
    <label><html:h2>ChatGPT (chat2api)</html:h2></label>
    <description style="margin: 0 0 6px">
      Uses ChatGPT quota through a local OpenAI-compatible gateway (chat2api).
      No Codex quota is consumed.
    </description>
    <hbox align="center">
      <label value="Endpoint" style="min-width: 12em" />
      <html:input
        type="text"
        preference="chatgptEndpoint"
        placeholder="http://127.0.0.1:5005/v1"
        style="flex: 1"
      />
    </hbox>
    <hbox align="center">
      <label value="Token" style="min-width: 12em" />
      <html:input
        type="password"
        preference="chatgptToken"
        placeholder="empty = use chat2api token file"
        style="flex: 1"
      />
    </hbox>
    <hbox align="center">
      <label value="Model" style="min-width: 12em" />
      <html:input
        id="pra-chatgpt-model"
        type="text"
        preference="chatgptModel"
        list="pra-chatgpt-models"
        placeholder="gpt-5"
        style="flex: 1"
      />
      <button id="pra-chatgpt-model-default" label="Use default" />
      <button id="pra-chatgpt-model-refresh" label="Refresh" />
    </hbox>
    <html:datalist id="pra-chatgpt-models"></html:datalist>
    <description
      id="pra-chatgpt-model-status"
      style="margin: 2px 0 5px 12em; color: var(--fill-secondary, #666)"
      >Loading model information…</description
    >
  </groupbox>

  <groupbox>
    <label><html:h2>General</html:h2></label>
    <hbox align="center">
      <checkbox preference="webSearch" label="Enable web search" />
    </hbox>
    <hbox align="center">
      <checkbox
        preference="libraryAccess"
        label="Let the agent read your whole library"
      />
    </hbox>
    <description
      style="margin: 0 0 5px 24px; color: var(--fill-secondary, #666)"
      >Adds your catalogue, collections, annotations and notes, and lets the
      agent search the full text of every attachment — so it can answer across
      papers. More of your library is sent to the agent CLI.</description
    >
    <hbox align="center">
      <label value="Turn timeout (seconds)" style="min-width: 12em" />
      <html:input
        type="number"
        preference="timeoutSec"
        min="30"
        max="3600"
        style="width: 7em"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <hbox align="center">
      <button id="pra-test" label="Test connection" />
      <label id="pra-test-status" value="" style="margin-inline-start: 8px" />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Updates</html:h2></label>
    <hbox align="center">
      <button id="pra-check-update" label="Check for updates" />
      <button
        id="pra-install-update"
        label="Install update"
        hidden="true"
        style="margin-inline-start: 8px"
      />
      <label id="pra-update-status" value="" style="margin-inline-start: 8px" />
    </hbox>
  </groupbox>
</vbox>
